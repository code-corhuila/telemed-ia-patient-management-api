name: telemed-ia-patient-management-api

services:
  patients-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: telemed-ia-patient-management-api:local
    container_name: patients-api
    restart: unless-stopped
    healthcheck:
      # Readiness of Spring Boot: DOWN (503) while the database is unreachable.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      DB_HOST: patients-db
      DB_PORT: "5432"
      DB_NAME: ${PATIENT_DB_NAME:-telemed_patient_db}
      DB_USER: ${PATIENT_DB_USER:-telemed_patient_user}
      DB_PASSWORD: ${PATIENT_DB_PASSWORD:?PATIENT_DB_PASSWORD is required}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      JPA_DDL_AUTO: validate
    expose:
      - "8080"
    networks:
      - platform

networks:
  platform:
    external: true
    name: platform